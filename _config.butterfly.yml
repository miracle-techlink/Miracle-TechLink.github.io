# Butterfly 主题覆盖配置(只写与默认不同的项)
# 完整默认配置见 node_modules/hexo-theme-butterfly/_config.yml

# ---------- 全站背景图(旧站配置,勿删) ----------
background: url('/images/cover_images/background.jpg')

# ---------- 首页顶部横幅(全屏居中,带打字机副标题) ----------
index_img: /images/cover_images/background.jpg
# 不设 index_top_img_height,默认 100vh 全屏

# ---------- 标签/归档页:无顶部横幅(一图流) ----------
tag_img: !!bool false
category_img: !!bool false
archive_img: !!bool false

# ---------- 侧边栏头像(老站 site-icon) ----------
avatar:
  img: /images/miracle%20techlink.png

# ---------- 页脚透明背景(老站配置) ----------
# 合并到下方统一的 inject 段

# ---------- 数学渲染:公式由 @vscode/markdown-it-katex 服务端渲染,此处仅注入 KaTeX 样式 ----------
katex:
  enable: false
mathjax:
  enable: false

# ---------- 导航/功能 ----------
local_search:
  enable: true
  preload: false
  top_n_per_article: 1

# 不蒜子数据 API 已超时挂掉(2026-10),统计项全关,避免资讯卡片永久转圈
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

fancybox: true

# ---------- 与旧站一致的特效 ----------
activate_power_mode:
  enable: true
  colorful: true
  shake: true
  mobile: false

fireworks:
  enable: true
  zIndex: 9999
  mobile: false

# ---------- 社交链接(老站配置) ----------
social:
  fab fa-github: https://github.com/miracle-techlink || Github || '#24292e'
  fas fa-envelope: mailto:miracle.techlink@gmail.com || Email || '#4a7dbe'

# ---------- 侧边栏作者卡片(老站配置) ----------
aside:
  card_author:
    enable: true
    description: explore the boundary of physical ai
    button:
      enable: false  # 禁用,避免和 social 重复
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/miracle-techlink
  card_announcement:
    enable: true
    content: i am now in lingbot embodied intelligence group
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# 运行天数(建站 2020,与 footer ©2020 对齐)
runtimeshow:
  enable: true
  site_uptime: 2020/09/17 00:00:00

# 字数统计(需 hexo-wordcount 插件)
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# ---------- 首页副标题(打字机效果) ----------
subtitle:
  enable: true
  effect: true
  typed_option:
    typeSpeed: 80
    backSpeed: 50
    loop: true
  source: false
  sub:
    - explore the boundary of physical ai

# ---------- 全局字体调大(默认14px→18px) ----------
font:
  global-font-size: 18px

# ---------- 注入:KaTeX 样式 + footer 透明 + live2d ----------
inject:
  head:
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/live2dw/lib/L2Dwidget.min.js"></script>
    - <script>L2Dwidget.init({"tagMode":false,"debug":false,"model":{"jsonPath":"/live2dw/assets/koharu.model.json"},"display":{"position":"left","width":150,"height":300},"mobile":{"show":false},"log":false,"pluginJsPath":"lib/","pluginModelPath":"assets/","pluginRootPath":"live2dw/"});</script>

# ---------- 文章页 ----------
post_meta:
  post:
    date_type: both
    tags: true

# 代码块 mac 风格圆角窗(旧站外观)
code_blocks:
  theme: mac
  macStyle: true
  wordWrap: false
  height_limit: false
  copy: true
  language: true
  shrink: true
  fullscreen: true

# 文章版权(旧站有 CC BY-NC-SA 4.0 声明)
post_copyright:
  enable: true
  decode: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 文末打赏/相关推荐等保持默认
