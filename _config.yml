# Hexo 站点配置 —— Miracle Techlink(自线上部署产物反向重建,2026-10)
title: Daniel Liu's blog
subtitle: "explore the boundary of physical ai"
description: "Link Tech, Link People, Link Future"
keywords:
author: Daniel Liu
language: zh-CN
timezone: Asia/Shanghai

# URL 保持与旧站完全一致(abbrlink 由各文章 front-matter 显式指定)
url: https://miracle-techlink.github.io
permalink: posts/:abbrlink.html
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: true

# 目录
source_dir: source
public_dir: public
tag_dir: tags
category_dir: categories
archive_dir: archives
category_mapper:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true

# markdown-it:公式服务端渲染(KaTeX),避免 marked 拆 $$ 块/吃下划线
markdown:
  preset: "default"
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: true
    typographer: false
  plugins:
    - katex-mdit-shim
  anchors:
    level: 2
    collisionSuffix: ""
    permalink: false
    permalinkClass: "header-anchor"
    permalinkSide: "left"
    permalinkSymbol: "¶"

# 首页分页
index_generator:
  path: ""
  per_page: 12
  order_by: -date

default_category: uncategorized
category_generator:
  per_page: 10
tag_generator:
  per_page: 10

# 日期格式
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# 分页
per_page: 12
pagination_dir: page

# 主题(npm 安装,hexo 自动解析为 node_modules/hexo-theme-butterfly)
theme: butterfly

# 背景图:两处都要——①根配置给 stylus 编译期 hexo-config() 生成 CSS;②theme_config 给 pug 模板生成 #web_bg div
background: url('/images/cover_images/background.jpg')
theme_config:
  background: url('/images/cover_images/background.jpg')
  tag_img: false
  category_img: false
  archive_img: false

# abbrlink:URL 唯一标识。已存在的 abbrlink 一律沿用,不重新生成
abbrlink:
  alg: crc32
  rep: hex

# 本地搜索(与旧站 local-search.js 对应)
search:
  path: search.xml
  field: post
  content: true
  format: html

# 部署:构建产物强推 main(与原 hexo deploy 流程一致)
deploy:
  type: git
  repo: git@github.com:miracle-techlink/miracle-techlink.github.io.git
  branch: main

# 不渲染的目录
include:
exclude:
ignore:
